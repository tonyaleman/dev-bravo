<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignUp</title>
    <link rel="stylesheet" href="../styles/style.css" />
  </head>
  <body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
                <span class="navbar-brand fs-2 fw-bold">GameLog</span>


        <div class="navbar-nav">
          <a class="nav-link border rounded me-2" href="../index.html">Home</a>
          <a class="nav-link border rounded" href="login.html">Log In</a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->

    <div class="toast" id="login-toast" role="alert">
    <div class="toast-header">
        <strong class="me-auto">GameLog</strong>
    </div>

    <div class="toast-body">Welcome!</div>
</div>

    <div class="row justify-content-center py-5">
      <div class="col-md-2">
        <div>
          <label for="username" class="form-label">Create Username</label>
          <input type="text" class="form-control" id="username" />
        </div>
        <div>
          <label for="password" class="form-label">Create Password</label>
          <input type="password" class="form-control" id="password"/>
        </div>
        <div>
          <label for="password" class="form-label">Re-Type Password</label>
          <input type="conf-password" class="form-control" id="conf-pass"/>
        </div>
        <div class="py-3">
          <input type="checkbox" class="form-check-input" id="checkYes" />
          <label class="form-check-label" for="checkYes">Remember Me</label>
        </div>
        <a href="library.html" class="btn btn-primary">Continue</a>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../scripts/app.js"></script>
  </body>
</html>
