
<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | GameLog</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container d-flex gap-3 align-items-center">
      <a class="navbar-brand fs-2 fw-bold" href="../index.html">
        GameLog <i class="bi bi-controller fs-1"></i>
      </a>

      <a href="library.html" class="btn btn-outline-light">
        Library
      </a>

      <button
        id="sign-out-btn"
        class="btn btn-primary ms-auto"
        type="button"
      >
        Sign Out
      </button>
    </div>
  </nav>

  <!-- Admin Content -->
  <main class="container py-5">
    <h1>Admin Dashboard</h1>

    <p>
      Development-only diagnostics: application state,
      records, and browser session information.
    </p>

    <div id="admin-message" role="status" class="mb-3"></div>

    <!-- Current User -->
    <h2 class="h4 mt-4">Current User</h2>
    <p id="admin-user"></p>

    <!-- Game Records -->
    <h2 class="h4 mt-4">Game Records</h2>

    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Platform</th>
            <th>Status</th>
            <th>Owner</th>
          </tr>
        </thead>

        <tbody id="admin-games"></tbody>
      </table>
    </div>

    <!-- Application State -->
    <h2 class="h4 mt-4">appState (JSON)</h2>

    <pre
      class="bg-light border rounded p-3"
      id="admin-state"
      style="white-space: pre-wrap; overflow-wrap: anywhere;"
    ></pre>

    <!-- Browser Information -->
    <h2 class="h4 mt-4">Browser / Session Details</h2>

    <pre
      class="bg-light border rounded p-3"
      id="admin-browser"
      style="white-space: pre-wrap; overflow-wrap: anywhere;"
    ></pre>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/app.js"></script>
</body>
</html>
