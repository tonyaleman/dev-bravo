<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In | GameLog</title>
  <link rel="stylesheet" href="../styles/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand fs-2 fw-bold" href="../index.html">
        GameLog <i class="bi bi-controller fs-1"></i>
      </a>
      <a class="btn btn-outline-light" href="../index.html">
        Home
      </a>
    </div>
  </nav>

  <main class="container py-5" style="max-width: 540px;">
    <h1 class="mb-3">Log In</h1>

    <p>
      Use a development account to test GameLog.
      Credentials are printed in the browser console.
    </p>

    <div
      id="login-message"
      class="mb-3"
      role="status"
      aria-live="polite"
    ></div>

    <form id="login-form">
      <div class="mb-3">
        <label for="username" class="form-label">
          Username
        </label>
        <input
          id="username"
          class="form-control"
          autocomplete="username"
          required
        >
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">
          Password
        </label>
        <input
          id="password"
          class="form-control"
          type="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button class="btn btn-primary" type="submit">
        Log In
      </button>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../scripts/app.js"></script>
</body>
</html>
